<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&display=swap" rel="stylesheet" />
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{ --brand:#2d8a6f; --brand-900:#0e3f34; --brand-700:#216b57; --mint:#8fe0c9; }
  html,body{background:#0e3f34;font-family:"Manrope",sans-serif}
  .canvas{position:relative;overflow:hidden;color:#fff}
  body[data-v="profile"] .canvas{width:1080px;height:1080px;background:radial-gradient(120% 120% at 50% 30%, #2f9a78 0%, #218067 42%, #12463a 100%)}
  body[data-v="cover"]   .canvas{width:1640px;height:624px;background:linear-gradient(120deg,#0e3f34 0%, #1c6350 52%, #2f9a78 130%)}

  /* ---------- PROFIL ---------- */
  .ring{position:absolute;inset:118px;border-radius:50%;border:4px solid rgba(143,224,201,.35)}
  .ring2{position:absolute;inset:150px;border-radius:50%;border:2px solid rgba(255,255,255,.10)}
  .bgdrop{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:720px;height:720px;opacity:.06}
  .pcenter{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0}
  .pcenter .logo{width:640px;max-width:66%;height:auto}
  .pcenter .rule{width:200px;height:5px;border-radius:3px;background:var(--mint);margin-top:44px}
  body:not([data-v="profile"]) .ring,body:not([data-v="profile"]) .ring2,body:not([data-v="profile"]) .bgdrop,body:not([data-v="profile"]) .pcenter{display:none}

  /* ---------- COVER ---------- */
  .photo{position:absolute;right:0;top:0;bottom:0;width:44%;background:url('daigler-vm.jpg') center 20%/cover no-repeat}
  .fade{position:absolute;inset:0;background:linear-gradient(90deg, #0e3f34 0%, #0e3f34 42%, rgba(14,63,52,.86) 55%, rgba(14,63,52,.42) 72%, rgba(14,63,52,.5) 100%)}
  .tint{position:absolute;inset:0;background:linear-gradient(120deg, rgba(45,138,111,.18), rgba(14,63,52,.05));mix-blend-mode:multiply}
  /* Textblock rechts vom Profilbild-Overlay (unten links) und in der Mobile-Safe-Zone */
  .safe{position:absolute;top:0;bottom:0;left:415px;width:900px;display:flex;flex-direction:column;justify-content:center;z-index:3}
  .safe .logo{width:520px;height:auto;filter:drop-shadow(0 6px 22px rgba(4,30,24,.4))}
  .safe .rule{width:120px;height:5px;border-radius:3px;background:var(--mint);margin:28px 0 22px}
  .safe .claim{font-weight:800;font-size:38px;letter-spacing:-.01em;line-height:1.15;max-width:740px;text-shadow:0 2px 18px rgba(4,30,24,.55)}
  .safe .meta{margin-top:20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  .safe .loc{font-weight:700;font-size:24px;color:#d7f3ea}
  .pill{display:inline-flex;align-items:center;gap:12px;background:#fff;color:var(--brand-900);font-weight:800;font-size:24px;border-radius:12px;padding:14px 22px;box-shadow:0 12px 30px rgba(4,30,24,.3)}
  .pill .arw{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--brand)}
  .pill .arw svg{width:18px;height:18px;stroke:#fff;stroke-width:3;fill:none}
  body:not([data-v="cover"]) .photo,body:not([data-v="cover"]) .fade,body:not([data-v="cover"]) .tint,body:not([data-v="cover"]) .safe{display:none}
</style>
</head>
<body data-v="profile">
  <div class="canvas">
    <!-- Profil -->
    <svg class="bgdrop" viewBox="0 0 100 100" aria-hidden="true"><path d="M50 6 C 70 40, 84 52, 84 68 A 34 34 0 1 1 16 68 C 16 52, 30 40, 50 6 Z" fill="#8fe0c9"/></svg>
    <div class="ring"></div><div class="ring2"></div>
    <div class="pcenter">
      <img class="logo" src="daigler-logo-weiss.png" alt="Daigler Kunststofftechnik" />
      <div class="rule"></div>
    </div>

    <!-- Cover -->
    <div class="photo"></div>
    <div class="fade"></div>
    <div class="tint"></div>
    <div class="safe">
      <img class="logo" src="daigler-logo-weiss.png" alt="Daigler Kunststofftechnik" />
      <div class="rule"></div>
      <div class="claim">Präzisions-Kunststofftechnik aus Trochtelfingen</div>
      <div class="meta">
        <span class="loc">2K-/3K-Spritzguss · seit 3 Generationen</span>
      </div>
      <div class="meta">
        <span class="pill">Wir stellen ein <span class="arw"><svg viewBox="0 0 24 24"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg></span></span>
        <span class="loc">daigler-gmbh.de</span>
      </div>
    </div>
  </div>
<script>
  var v=new URLSearchParams(location.search).get("v"); if(v) document.body.setAttribute("data-v",v);
</script>
</body>
</html>
